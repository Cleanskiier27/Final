<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SSD Demo Slides</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/reveal.js/dist/reveal.css">
  <link rel="stylesheet" href="https://unpkg.com/reveal.js/dist/theme/black.css" id="theme">
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section>
        <h1>SSD Master Dashboard — Demo</h1>
        <p>Interactive charts, content viewer, and live slides.</p>
      </section>
      <section>
        <h2>Data Overview</h2>
        <p>Import your xref HTML into the viewer to populate charts.</p>
      </section>
      <section>
        <h2>Live Demo</h2>
        <p>Use filters to drill down; click series to focus.</p>
      </section>
    </div>
  </div>
  <script src="https://unpkg.com/reveal.js/dist/reveal.js"></script>
  <script>
    Reveal.initialize({ hash: true });
  </script>
</body>
</html>
